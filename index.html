<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Dinámico PREPARA 360 - Regional 15</title>
    <!-- Importamos Chart.js para los gráficos dinámicos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 20px; color: #333; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-top: 0; margin-bottom: 25px; }
        
        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 30px; flex-wrap: wrap; }
        button { padding: 10px 18px; cursor: pointer; border: none; border-radius: 6px; background: #2980b9; color: white; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #1abc9c; }

        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid #2980b9; }
        .card h3 { margin: 0; color: #7f8c8d; font-size: 0.85em; text-transform: uppercase; }
        .card p { font-size: 1.8em; font-weight: bold; margin: 10px 0 0; color: #2c3e50; }

        .charts-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); gap: 20px; }
        .chart-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-box h3 { text-align: center; color: #34495e; margin-top: 0; }
        
        @media (max-width: 600px) {
            .charts-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <h1>PREPARA 360 - Dashboard Regional</h1>
    <p class="subtitle">Subsistema de Educación de Personas Jóvenes y Adultas (EPJA)[cite: 3]</p>

    <!-- Botones de Control / Filtros Interactivos -->
    <div class="controls">
        <button onclick="cambiarDistrito('Regional')">Consolidado Regional</button>
        <button onclick="cambiarDistrito('15-01')">15-01 Los Alcarrizos</button>
        <button onclick="cambiarDistrito('15-02')">15-02 Centro</button>
        <button onclick="cambiarDistrito('15-03')">15-03 Surcentral</button>
        <button onclick="cambiarDistrito('15-04')">15-04 Noroeste</button>
        <button onclick="cambiarDistrito('15-05')">15-05 Herrera</button>
        <button onclick="cambiarDistrito('15-06')">15-06 Pedro Brand</button>
    </div>

    <!-- Tarjetas de Métricas Clave -->
    <div class="dashboard-grid">
        <div class="card"><h3>Matrícula Total</h3><p id="valMatricula">27,139</p></div>
        <div class="card" style="border-top-color: #e67e22;"><h3>Centros Educativos</h3><p id="valCentros">59</p></div>
        <div class="card" style="border-top-color: #27ae60;"><h3>Tasa de Promoción</h3><p id="valPromocion">67.4%</p></div>
        <div class="card" style="border-top-color: #c0392b;"><h3>Tasa de Abandono</h3><p id="valAbandono">24.6%</p></div>
    </div>

    <!-- Contenedor de Gráficos Dinámicos -->
    <div class="charts-container">
        <div class="chart-box">
            <h3>Eficiencia Interna (%)</h3>
            <canvas id="graficoEficiencia"></canvas>
        </div>
        <div class="chart-box">
            <h3>Estructura Operativa</h3>
            <canvas id="graficoOperativo"></canvas>
        </div>
    </div>

    <script>
        // Base de datos estructurada con los indicadores oficiales de la Regional 15
        const baseDatos = {
            'Regional': { mat: '27,139', cen: '59', pro: '67.4%', aba: '24.6%', ef: [67.4, 8.0, 24.6], op: [59, 52] },
            '15-01':    { mat: '6,633',  cen: '18', pro: '67.3%', aba: '19.8%', ef: [67.3, 12.9, 19.8], op: [18, 15] },
            '15-02':    { mat: '4,400',  cen: '8',  pro: '69.9%', aba: '22.3%', ef: [69.9, 7.8, 22.3],  op: [8, 8]   },
            '15-03':    { mat: '2,398',  cen: '7',  pro: '60.8%', aba: '32.9%', ef: [60.8, 6.3, 32.9], op: [7, 5]   },
            '15-04':    { mat: '4,983',  cen: '10', pro: '68.3%', aba: '25.1%', ef: [68.3, 6.5, 25.1], op: [10, 8]  },
            '15-05':    { mat: '6,795',  cen: '9',  pro: '69.1%', aba: '25.9%', ef: [69.1, 5.0, 25.9], op: [9, 9]   },
            '15-06':    { mat: '1,930',  cen: '7',  pro: '69.1%', aba: '21.5%', ef: [69.1, 9.4, 21.5], op: [7, 7]   }
        };

        // Inicialización de Gráficos con Chart.js
        const ctxEficiencia = document.getElementById('graficoEficiencia').getContext('2d');
        const graficoEficiencia = new Chart(ctxEficiencia, {
            type: 'bar',
            data: {
                labels: ['Promovido', 'Reprobado', 'Abandono'],
                datasets: [{
                    label: 'Porcentaje (%)',
                    data: [67.4, 8.0, 24.6],
                    backgroundColor: ['#27ae60', '#f39c12', '#c0392b'],
                    borderWidth: 1
                }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true, max: 100 } } }
        });

        const ctxOperativo = document.getElementById('graficoOperativo').getContext('2d');
        const graficoOperativo = new Chart(ctxOperativo, {
            type: 'doughnut',
            data: {
                labels: ['Centros Educativos', 'Directores Asignados'],
                datasets: [{
                    data: [59, 52],
                    backgroundColor: ['#2980b9', '#8e44ad']
                }]
            },
            options: { responsive: true }
        });

        // Función dinámica de actualización al hacer clic en los botones
        function cambiarDistrito(key) {
            const info = baseDatos[key];
            
            // Actualizar tarjetas de texto
            document.getElementById('valMatricula').innerText = info.mat;
            document.getElementById('valCentros').innerText = info.cen;
            document.getElementById('valPromocion').innerText = info.pro;
            document.getElementById('valAbandono').innerText = info.aba;

            // Actualizar datos del Gráfico de Eficiencia
            graficoEficiencia.data.datasets[0].data = info.ef;
            graficoEficiencia.update();

            // Actualizar datos del Gráfico Operativo
            graficoOperativo.data.datasets[0].data = info.op;
            graficoOperativo.update();
        }
    </script>
</body>
</html>
